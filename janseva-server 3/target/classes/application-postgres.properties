# Activate with: mvn spring-boot:run -Dspring-boot.run.profiles=postgres
# Provide DB_URL / DB_USERNAME / DB_PASSWORD as environment variables or
# -D system properties - never commit real credentials to this file.

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/janseva}
spring.datasource.username=postgres
spring.datasource.password=Nillan@1821
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use "update" against a persistent Postgres instance so data survives restarts;
# H2 (the default profile) uses create-drop for a guaranteed-fresh demo schema.
spring.jpa.hibernate.ddl-auto=update