spring.application.name=janseva-backend

# --- Database: file-based H2 is the unconditional default, no profile needed ---
# Unlike jdbc:h2:mem:..., this writes to a .mv.db file under ./data so your
# data (registered citizens, applications, grievances, etc.) survives an
# app restart instead of being wiped every time. Still requires no separate
# database server to install - the file is created automatically on first run.
# (To use PostgreSQL instead, explicitly activate the "postgres" profile -
# see application-postgres.properties - which reads connection details from
# environment variables rather than committing them to source control.)
spring.datasource.url=jdbc:h2:file:./data/jansevadb;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=true
# "update" (not create-drop) so the schema evolves without wiping existing rows.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=false

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.serialization.write-dates-as-timestamps=false

# Server
server.port=8080
server.error.include-message=always

# JWT
# jwt-secret MUST be overridden via the JWT_SECRET environment variable in any
# real deployment (SRS Appendix D: "Secret Key: Never hardcoded in source
# code"). The literal value below is a placeholder for local dev only.
janseva.security.jwt-secret=${JWT_SECRET:vBhbSog5HgQlUVC+03dCE+wWMgtkM2y0s/3K/TUvMzYY2z4sltYuePt+VaqR1oli}
janseva.security.jwt-expiration-ms=86400000

# Swagger
springdoc.swagger-ui.path=/swagger-ui.html